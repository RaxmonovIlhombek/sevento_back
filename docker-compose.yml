# Lokal/ishlab chiqarish uchun to'liq to'plam. `cp .env.example .env` qilib `docker compose up --build`.
# Frontend ../sevento_front dan build qilinadi (FRONTEND_DIR bilan o'zgartiriladi).

x-backend: &backend
  build: .
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
    DATABASE_URL: postgres://${POSTGRES_USER:-sevento}:${POSTGRES_PASSWORD:-sevento}@postgres:5432/${POSTGRES_DB:-sevento}
    REDIS_URL: redis://redis:6379/0
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
  volumes:
    - media:/app/media
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sevento}
      POSTGRES_USER: ${POSTGRES_USER:-sevento}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sevento}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sevento} -d ${POSTGRES_DB:-sevento}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    <<: *backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  celery_worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency", "2"]
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
      DATABASE_URL: postgres://${POSTGRES_USER:-sevento}:${POSTGRES_PASSWORD:-sevento}@postgres:5432/${POSTGRES_DB:-sevento}
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "0"
    depends_on:
      backend:
        condition: service_healthy

  celery_beat:
    <<: *backend
    command:
      ["celery", "-A", "config", "beat", "-l", "info",
       "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
      DATABASE_URL: postgres://${POSTGRES_USER:-sevento}:${POSTGRES_PASSWORD:-sevento}@postgres:5432/${POSTGRES_DB:-sevento}
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "0"
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ${FRONTEND_DIR:-../sevento_front}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  media:
