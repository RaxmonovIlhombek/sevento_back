[project]
name = "sevento-backend"
version = "0.1.0"
description = "Sevento — savdo, ombor, nasiya va kassa hisobi (backend)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "T20"]
ignore = ["DJ001"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]
"**/tests/**" = ["S", "B011"]
"conftest.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["config", "core", "apps"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["core", "apps"]
addopts = "-ra -q --strict-markers"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.importlinter]
root_packages = ["config", "core", "apps"]
include_external_packages = false

# core — umumiy yadro: biznes app lariga bog'lanmaydi
[[tool.importlinter.contracts]]
name = "core apps ga bog'lanmaydi"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["apps"]

# App lar bir-birining models/serializers/views qatlamiga yopishmaydi:
