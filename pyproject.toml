[tool.coverage.run]
source = ["apps", "core", "config"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "config/settings/dev.py",
    "config/settings/prod.py",
    "config/wsgi.py",
]

[tool.coverage.report]
# CI shu chegaradan pastga tushsa qizil (hozir ~97%)
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
