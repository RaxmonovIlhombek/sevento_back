        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
          enum:
          - shop
          - warehouse
        description: |-
          * `shop` - Do'kon
          * `warehouse` - Ombor
      tags:
      - branches
      security:
      - jwtAuth: []
      responses:
        '200':
