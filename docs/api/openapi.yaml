    post:
      operationId: reports_export_create
      description: Yengil hisobot — fayl darhol; og'ir yoki uzun davr — 202 + ReportJob
        (report.ready).
      parameters:
      - in: path
        name: key
        schema:
          type: string
          pattern: ^[a-z0-9_]+$
        required: true
      tags:
