components:
  schemas:
    AllocationMethodEnum:
      enum:
      - by_value
      - by_quantity
      type: string
      description: |-
        * `by_value` - Qiymat bo'yicha
        * `by_quantity` - Miqdor bo'yicha
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        event_name:
          type: string
          readOnly: true
        aggregate_type:
          type: string
          readOnly: true
        aggregate_id:
          type: integer
          readOnly: true
          nullable: true
        actor:
          type: integer
          readOnly: true
          nullable: true
        actor_username:
          type: string
          readOnly: true
        actor_full_name:
          type: string
          readOnly: true
        branch:
          type: integer
          readOnly: true
          nullable: true
        branch_name:
          type: string
          readOnly: true
        payload:
          readOnly: true
        ip:
          type: string
          readOnly: true
        request_id:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - actor_full_name
      - actor_username
      - aggregate_id
      - aggregate_type
      - branch
      - branch_name
      - created_at
      - event_name
      - id
      - ip
      - payload
      - request_id
    Batch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        branch:
          type: integer
          readOnly: true
        branch_name:
          type: string
          readOnly: true
        product:
          type: integer
          readOnly: true
        product_name:
          type: string
          readOnly: true
        unit_code:
          type: string
          readOnly: true
        source_type:
          type: string
          readOnly: true
        source_id:
          type: integer
          readOnly: true
        source_number:
          type: string
          readOnly: true
        received_at:
          type: string
          format: date-time
          readOnly: true
        quantity_initial:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        quantity_remaining:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        unit_cost_base:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,6})?$
          readOnly: true
      required:
      - branch
      - branch_name
      - id
      - product
      - product_name
      - quantity_initial
      - quantity_remaining
      - received_at
      - source_id
      - source_number
      - source_type
      - unit_code
      - unit_cost_base
    Branch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          description: Hujjat raqamlarida ishlatiladi
          maxLength: 10
        name:
          type: string
          maxLength: 100
        type:
          $ref: '#/components/schemas/BranchTypeEnum'
        address:
          type: string
          maxLength: 255
        phone:
          type: string
          maxLength: 30
        settings: {}
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - id
      - name
      - updated_at
    BranchRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          description: Hujjat raqamlarida ishlatiladi
          maxLength: 10
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: '#/components/schemas/BranchTypeEnum'
        address:
          type: string
          maxLength: 255
        phone:
          type: string
          maxLength: 30
        settings: {}
        is_active:
          type: boolean
      required:
      - code
      - name
    BranchTypeEnum:
      enum:
      - shop
      - warehouse
      type: string
      description: |-
        * `shop` - Do'kon
        * `warehouse` - Ombor
    CancelRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - reason
    Capability:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        group:
          type: string
      required:
      - code
      - group
      - name
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        parent:
          type: integer
          nullable: true
        parent_name:
          type: string
          readOnly: true
          nullable: true
        sort_order:
          type: integer
          maximum: 32767
          minimum: 0
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - parent_name
      - updated_at
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        parent:
          type: integer
          nullable: true
        sort_order:
          type: integer
          maximum: 32767
          minimum: 0
        is_active:
          type: boolean
      required:
      - name
    CategoryTree:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        sort_order:
          type: integer
        is_active:
          type: boolean
        parent:
          type: integer
          nullable: true
        children:
          type: array
          items:
            $ref: '#/components/schemas/CategoryTree'
      required:
      - children
      - id
      - is_active
      - name
      - parent
      - sort_order
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - current_password
      - new_password
    CostPreview:
      type: object
      properties:
        rate_to_base:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,12})?$
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,4})?$
        subtotal_base:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,4})?$
        expenses_total_base:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,4})?$
        total_base:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,4})?$
        lines:
          type: array
