      description: Ombor harakatlari jurnali. Tannarx ustunlari — faqat inventory.view_cost
        bilan.
      parameters:
      - in: query
        name: branch
        schema:
          type: number
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: direction
        schema:
          type: string
          enum:
          - in
          - out
        description: |-
          * `in` - in
          * `out` - out
      - in: query
        name: document_id
        schema:
          type: integer
      - in: query
        name: document_type
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: product
        schema:
          type: number
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: array
          items:
            type: string
            enum:
            - count_shortage
            - count_surplus
            - purchase_cancel
            - purchase_in
            - sale_out
            - sale_return_in
            - transfer_in
            - transfer_out
            - write_off
        description: |-
          * `purchase_in` - Kirim
          * `purchase_cancel` - Kirim bekor qilindi
          * `sale_out` - Savdo
          * `sale_return_in` - Qaytarish
          * `transfer_out` - Ko'chirish (jo'natildi)
          * `transfer_in` - Ko'chirish (qabul qilindi)
          * `count_surplus` - Inventarizatsiya: ortiqcha
          * `count_shortage` - Inventarizatsiya: kamomad
          * `write_off` - Hisobdan chiqarish
        explode: true
        style: form
      tags:
      - inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStockMovementList'
          description: ''
