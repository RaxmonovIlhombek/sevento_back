openapi: 3.0.3
info:
  title: Sevento API
  version: 1.0.0
  description: Savdo, ombor, nasiya va kassa hisobi tizimi. Endpointlar /api/v1/ ostida.
paths:
  /api/v1/audit/:
    get:
      operationId: audit_list
      description: 'ViewSet: capability_map = {"list": "x.view", "create": "x.manage",
        ...}.'
      parameters:
      - in: query
        name: actor
        schema:
          type: integer
      - in: query
        name: aggregate_id
        schema:
          type: integer
      - in: query
        name: aggregate_type
        schema:
          type: string
      - in: query
        name: branch
        schema:
          type: integer
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: event_name
        schema:
          type: string
      - in: query
        name: event_prefix
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - audit
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/audit/{id}/:
    get:
      operationId: audit_retrieve
      description: 'ViewSet: capability_map = {"list": "x.view", "create": "x.manage",
        ...}.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this audit log.
        required: true
      tags:
      - audit
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/v1/auth/capabilities/:
    get:
      operationId: auth_capabilities_list
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
