  /api/v1/reports/{key}/:
    get:
      operationId: reports_retrieve
      description: |-
        Hisobotlar reyestri. Ko'rish — JSON (ekranda); fayl — PDF/Excel.

        Har hisobotning o'z huquqi bor (`reports.view` / `reports.financial`); nuqta chegarasi
        selectorlarda qo'llanadi. Parametrlar — hisobot `filters` ro'yxatidagi nomlar.
      parameters:
      - in: path
        name: key
        schema:
          type: string
          pattern: ^[a-z0-9_]+$
        required: true
      - in: query
        name: params
        schema:
          type: object
          additionalProperties: {}
        description: hisobot filtrlari (date_from, date_to, branch, ...)
        explode: true
        style: form
      tags:
      - reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Xato
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Xato
