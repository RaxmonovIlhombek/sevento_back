components:
  schemas:
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        event_name:
          type: string
          readOnly: true
        aggregate_type:
          type: string
          readOnly: true
        aggregate_id:
          type: integer
          readOnly: true
          nullable: true
        actor:
          type: integer
          readOnly: true
          nullable: true
        actor_username:
          type: string
          readOnly: true
        actor_full_name:
          type: string
          readOnly: true
        branch:
          type: integer
          readOnly: true
          nullable: true
        branch_name:
          type: string
          readOnly: true
        payload:
          readOnly: true
        ip:
          type: string
          readOnly: true
        request_id:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - actor_full_name
      - actor_username
      - aggregate_id
      - aggregate_type
      - branch
      - branch_name
      - created_at
      - event_name
      - id
      - ip
      - payload
      - request_id
    Branch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          description: Hujjat raqamlarida ishlatiladi
          maxLength: 10
        name:
          type: string
          maxLength: 100
        type:
          $ref: '#/components/schemas/TypeEnum'
        address:
          type: string
          maxLength: 255
        phone:
          type: string
          maxLength: 30
        settings: {}
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - id
      - name
      - updated_at
    BranchRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          description: Hujjat raqamlarida ishlatiladi
          maxLength: 10
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: '#/components/schemas/TypeEnum'
        address:
          type: string
          maxLength: 255
        phone:
          type: string
          maxLength: 30
        settings: {}
        is_active:
          type: boolean
      required:
      - code
      - name
    Capability:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        group:
          type: string
      required:
      - code
      - group
      - name
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - current_password
      - new_password
    ErrorBody:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        request_id:
          type: string
      required:
      - code
      - details
      - message
      - request_id
    ErrorDetail:
      type: object
      properties:
        field:
          type: string
          nullable: true
        code:
          type: string
        message:
          type: string
      required:
      - code
      - field
      - message
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - error
    Health:
      type: object
      properties:
        status:
          type: string
        db:
          type: boolean
        redis:
          type: boolean
      required:
      - db
      - redis
      - status
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    LoginResponse:
      type: object
      properties:
        access:
          type: string
        user:
          $ref: '#/components/schemas/Me'
      required:
      - access
      - user
    Me:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        full_name:
          type: string
        phone:
          type: string
        is_superuser:
          type: boolean
        role:
          allOf:
          - $ref: '#/components/schemas/RoleBrief'
          nullable: true
        capabilities:
          type: array
          items:
            type: string
        branches:
          type: array
          items:
            $ref: '#/components/schemas/UserBranch'
        all_branches:
          type: boolean
      required:
      - all_branches
      - branches
