openapi: 3.0.3
info:
  title: Sevento API
  version: 1.0.0
  description: Savdo, ombor, nasiya va kassa hisobi tizimi. Endpointlar /api/v1/ ostida.
paths:
  /api/v1/accounting/accounts/:
    get:
      operationId: accounting_accounts_list
      parameters:
      - in: query
        name: account_type
        schema:
          type: string
          enum:
          - asset
          - equity
          - expense
          - income
          - liability
        description: |-
          * `asset` - Aktiv
          * `liability` - Passiv
          * `equity` - Kapital
          * `income` - Daromad
          * `expense` - Xarajat
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: is_postable
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: parent
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - accounting
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountList'
          description: ''
    post:
      operationId: accounting_accounts_create
      tags:
      - accounting
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
  /api/v1/accounting/accounts/{id}/:
    get:
      operationId: accounting_accounts_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this account.
        required: true
      tags:
      - accounting
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
    put:
      operationId: accounting_accounts_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this account.
        required: true
      tags:
