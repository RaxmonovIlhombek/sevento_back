databases:
  - name: sevento-db
    databaseName: sevento
    user: sevento
    plan: free

services:
  # Redis (Key Value)
  - type: keyvalue
    name: sevento-redis
    plan: free
    ipAllowList: []

  # Backend — asosiy web server (uvicorn/ASGI)
  - type: web
    name: sevento-backend
    runtime: docker
    plan: free
    repo: https://github.com/RaxmonovIlhombek/sevento_back
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sevento-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: sevento-redis
          type: keyvalue
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: sevento-backend.onrender.com
      - key: DJANGO_TRUSTED_ORIGINS
        value: https://sevento-backend.onrender.com
      - key: JWT_ACCESS_MINUTES
        value: "15"
      - key: JWT_REFRESH_DAYS
        value: "7"
      - key: JWT_REFRESH_COOKIE_NAME
        value: sevento_refresh
      - key: JWT_REFRESH_COOKIE_SECURE
        value: "True"
      - key: JWT_REFRESH_COOKIE_SAMESITE
        value: Strict
      - key: REALTIME_TICKET_TTL
        value: "30"
      - key: REALTIME_MAX_CONNECTIONS_PER_USER
        value: "10"
      - key: THROTTLE_LOGIN
        value: 10/min
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
      - key: BOOTSTRAP_ADMIN_FULL_NAME
        value: Rahbar
      - key: RUN_MIGRATIONS
        value: "1"

  # Celery Worker — fon vazifalari (hisobotlar, email va boshqalar)
  - type: worker
    name: sevento-celery-worker
    runtime: docker
    plan: free
    repo: https://github.com/RaxmonovIlhombek/sevento_back
    branch: main
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A config worker -l info
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        fromService:
          name: sevento-backend
          type: web
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: sevento-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: sevento-redis
          type: keyvalue
          property: connectionString
      - key: RUN_MIGRATIONS
        value: "0"

  # Celery Beat — jadval (davriy vazifalar, valyuta kursi yangilash va boshqalar)
  - type: worker
    name: sevento-celery-beat
    runtime: docker
    plan: free
    repo: https://github.com/RaxmonovIlhombek/sevento_back
    branch: main
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        fromService:
          name: sevento-backend
          type: web
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: sevento-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: sevento-redis
          type: keyvalue
          property: connectionString
      - key: RUN_MIGRATIONS
        value: "0"
