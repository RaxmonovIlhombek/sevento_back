databases:
  - name: sevento-db
    databaseName: sevento
    user: sevento
    plan: free

services:
  # Redis (Key Value)
  - type: keyvalue
    name: sevento-redis
    plan: free
    ipAllowList: []

  # Backend — uvicorn + celery worker + celery beat (supervisord bilan bitta konteynerda)
  # Render bepul rejasida Background Worker yo'q, shuning uchun hammasi shu yerda
  - type: web
    name: sevento-backend
    runtime: docker
    plan: free
    repo: https://github.com/RaxmonovIlhombek/sevento_back
    branch: main
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sevento-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: sevento-redis
          type: keyvalue
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: sevento-backend.onrender.com
      - key: DJANGO_TRUSTED_ORIGINS
        value: https://sevento-backend.onrender.com,https://sevento.netlify.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://sevento.netlify.app
      - key: JWT_ACCESS_MINUTES
        value: "15"
      - key: JWT_REFRESH_DAYS
        value: "7"
      - key: JWT_REFRESH_COOKIE_NAME
        value: sevento_refresh
      - key: JWT_REFRESH_COOKIE_SECURE
        value: "True"
      - key: JWT_REFRESH_COOKIE_SAMESITE
        value: Strict
      - key: REALTIME_TICKET_TTL
        value: "30"
      - key: REALTIME_MAX_CONNECTIONS_PER_USER
        value: "10"
      - key: THROTTLE_LOGIN
        value: 10/min
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
      - key: BOOTSTRAP_ADMIN_FULL_NAME
        value: Rahbar
      - key: RUN_MIGRATIONS
        value: "1"
